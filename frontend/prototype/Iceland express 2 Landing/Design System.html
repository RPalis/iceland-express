<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iceland Express — Design System Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* DS sidebar navigation */
    .ds-page { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .ds-sidebar {
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      background: var(--card-2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 0; flex-shrink: 0;
      padding-bottom: 24px;
    }
    .ds-sidebar::-webkit-scrollbar { width: 4px; }
    .ds-sidebar::-webkit-scrollbar-thumb { background: var(--fill); border-radius: 99px; }
    .ds-sidebar-logo {
      display: flex; align-items: center; gap: 8px;
      padding: 20px 18px 16px;
      font-family: var(--font-display); font-weight: 700; font-size: 14px;
      color: var(--fg); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ds-sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .ds-sidebar-group { margin-bottom: 4px; }
    .ds-sidebar-group-label {
      font-family: var(--font-display); font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--dim); padding: 10px 18px 4px;
    }
    .ds-sidebar-link {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 18px 7px 14px;
      font-family: var(--font-display); font-size: 13px; font-weight: 500;
      color: var(--muted); cursor: pointer; transition: color .14s, background .14s;
      border-radius: 0; position: relative; text-decoration: none;
    }
    .ds-sidebar-link:hover { color: var(--fg); background: var(--fill-soft); }
    .ds-sidebar-link.active { color: var(--primary-strong); font-weight: 600; background: var(--primary-tint); }
    .ds-sidebar-pip {
      width: 3px; height: 16px; border-radius: 99px;
      background: var(--primary); flex-shrink: 0; margin-left: -2px;
    }
    .ds-sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ds-sidebar-back {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-display); font-size: 13px; font-weight: 600;
      color: var(--muted); transition: color .14s;
    }
    .ds-sidebar-back:hover { color: var(--primary-strong); }
    .ds-main { min-width: 0; padding-bottom: 80px; }
    @media (max-width: 900px) {
      .ds-page { grid-template-columns: 1fr; }
      .ds-sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; z-index: 50; transform: translateX(-100%); transition: transform .25s; }
      .ds-sidebar.open { transform: none; }
    }
    .ds-section { padding: 48px 40px 0; max-width: 1100px; }
    .ds-section-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: var(--fg); margin: 0 0 6px; padding-bottom: 14px; border-bottom: 2px solid var(--border); }
    .ds-sub { font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin: 32px 0 14px; }
    .ds-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .ds-col { display: flex; flex-direction: column; gap: 12px; }
    .ds-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 24px; }
    .ds-label { font-size: 11px; color: var(--dim); font-family: monospace; margin-top: 8px; letter-spacing: 0.04em; }
    .ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .ds-token { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .ds-swatch { width: 36px; height: 36px; border-radius: var(--r-sm); flex: none; border: 1px solid rgba(255,255,255,0.07); }
    .ds-screen-chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); font-family: var(--font-display); font-size: 13px; font-weight: 600; cursor: pointer; transition: border-color .14s, background .14s; }
    .ds-screen-chip:hover { border-color: var(--primary); background: var(--primary-tint); }
    .ds-screen-chip .chip-id { font-size: 11px; background: var(--primary-tint); color: var(--primary-strong); padding: 2px 7px; border-radius: var(--r-pill); }
    .spec-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .spec-table th { text-align: left; color: var(--dim); font-weight: 600; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .spec-table td { padding: 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
    .spec-table tr:last-child td { border-bottom: none; }
    .spec-table code { font-family: monospace; font-size: 12px; background: var(--inner); padding: 2px 6px; border-radius: 4px; color: var(--primary-strong); }
    .preview-dark { background: var(--bg); padding: 24px; border-radius: var(--r-md); border: 1px solid var(--border); }
    .preview-card { background: var(--card); padding: 24px; border-radius: var(--r-md); border: 1px solid var(--border); }
    .ds-divider { height: 1px; background: var(--border); margin: 40px 0 0; }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Web components -->
  <script src="image-slot.js"></script>

  <!-- Design system — foundation layer -->
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="tokens.jsx"></script>

  <!-- Design system — component layers -->
  <script type="text/babel" src="ds-atoms.jsx"></script>
  <script type="text/babel" src="ds-molecules.jsx"></script>
  <script type="text/babel" src="ds-organisms.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>

  <!-- Shared UI -->
  <script type="text/babel" src="ui.jsx"></script>

  <!-- Blog data (for BlogCardV2 previews) -->
  <script type="text/babel" src="blog-data.jsx"></script>

  <!-- DS Reference app -->
  <script type="text/babel" src="ds-app.jsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
