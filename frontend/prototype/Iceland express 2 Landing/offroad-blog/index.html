<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F-Roads & the Highlands — Iceland Express Travel Guides</title>
  <meta name="description" content="When to go, which 4×4 you need, and the five highland routes that reward the adventurous driver." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />

  <!-- ── LAYER 1: Design Tokens ── -->
  <link rel="stylesheet" href="styles/tokens.css" />

  <!-- ── LAYER 2: Component Styles ── -->
  <link rel="stylesheet" href="styles/blog-post.css" />

  <!-- React + Babel (development build — swap for production bundles when shipping) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <!-- image-slot web component (drag-and-drop image placeholder) -->
  <script src="https://unpkg.com/@webcomponents/custom-elements"></script>
</head>
<body>

<div id="root"></div>

<!--
  ════════════════════════════════════════════════════════════
  LOAD ORDER — atomic design layers, bottom-up
  ════════════════════════════════════════════════════════════

  Layer 1 · Tokens (CSS variables — already loaded above)

  Layer 2 · Atoms
    Each file exports one primitive component to window.

  Layer 3 · Molecules
    Compose atoms. Loaded after atoms.

  Layer 4 · Organisms
    Compose atoms + molecules. Loaded after molecules.

  Layer 5 · Template
    Wires all organisms into the full page shell.

  Layer 6 · Data
    Post content, car data, related posts.

  Layer 7 · App entry
    Inline script — mounts the React root.
  ════════════════════════════════════════════════════════════
-->

<!-- ── LAYER 2: Atoms ── -->
<script type="text/babel" src="atoms/Icon.jsx"></script>
<script type="text/babel" src="atoms/Stars.jsx"></script>
<script type="text/babel" src="atoms/Btn.jsx"></script>
<script type="text/babel" src="atoms/Badge.jsx"></script>
<script type="text/babel" src="atoms/Avatar.jsx"></script>
<script type="text/babel" src="atoms/Sep.jsx"></script>

<!-- ── LAYER 3: Molecules ── -->
<script type="text/babel" src="molecules/MetaRow.jsx"></script>
<script type="text/babel" src="molecules/FreeCancBadge.jsx"></script>
<script type="text/babel" src="molecules/PullQuote.jsx"></script>
<script type="text/babel" src="molecules/CarSpec.jsx"></script>
<script type="text/babel" src="molecules/RatingChip.jsx"></script>
<script type="text/babel" src="molecules/PostSection.jsx"></script>

<!-- ── LAYER 4: Organisms ── -->
<script type="text/babel" src="organisms/NavBar.jsx"></script>
<script type="text/babel" src="organisms/PostHero.jsx"></script>
<script type="text/babel" src="organisms/MidArticleCTA.jsx"></script>
<script type="text/babel" src="organisms/PostBody.jsx"></script>
<script type="text/babel" src="organisms/PostSidebar.jsx"></script>
<script type="text/babel" src="organisms/RelatedPosts.jsx"></script>
<script type="text/babel" src="organisms/EndCTA.jsx"></script>
<script type="text/babel" src="organisms/MobileBookingBar.jsx"></script>
<script type="text/babel" src="organisms/Footer.jsx"></script>

<!-- ── LAYER 5: Template ── -->
<script type="text/babel" src="templates/BlogPostTemplate.jsx"></script>

<!-- ── LAYER 6: Data ── -->
<script type="text/babel" src="data/post-data.jsx"></script>

<!-- ── LAYER 7: App entry ── -->
<script type="text/babel">
// ─────────────────────────────────────────────────────────────
// App entry point
// Mounts BlogPostTemplate with the highland-f-roads post data.
// Replace onBook / onHome / onPost with your own router calls.
// ─────────────────────────────────────────────────────────────

function App() {
  // Navigation handlers — replace with router calls in production
  function onBook()       { alert('→ Navigate to Search Results (A2)'); }
  function onHome()       { alert('→ Navigate to Homepage (A1)'); }
  function onPost(id)     { alert('→ Navigate to post: ' + id); }

  return (
    <BlogPostTemplate
      post={POST_DATA}
      car={RECOMMENDED_CAR}
      relatedPosts={RELATED_POSTS}
      onBook={onBook}
      onHome={onHome}
      onPost={onPost}
    />
  );
}

// DOMContentLoaded guard — scripts are in <body> so this fires immediately,
// but keeping the guard makes the file safe to move to <head> if needed.
function mount() {
  const root = document.getElementById('root');
  if (!root) { console.error('[App] #root not found'); return; }
  ReactDOM.createRoot(root).render(<App />);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', mount);
} else {
  mount();
}
</script>

</body>
</html>
